name: Fix Translations (single locale)

# Repairs pages that Lingo left as English passthrough (or never created) for ONE
# target locale, without touching the other languages. Force-retranslates only the
# broken files, then opens a PR. See scripts/fixTranslations.ts.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Target locale to repair (any i18n.json target)"
        required: true
        default: "zh-CN"
        type: choice
        options:
          - zh-CN
          - ja
          - ko
          - ar
          - hi
          - de
          - es
          - fr
          - id
          - it
          - pt-BR
          - sv
          - vi
      concurrency:
        description: "Translation concurrency (Lingo max is 10)"
        required: false
        default: "8"
      max_attempts:
        description: "Max retranslate/verify passes for files that keep failing"
        required: false
        default: "3"

jobs:
  fix-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must stay >= 20.17: the `mint` CLI refuses to run on older Node and
          # the validation step would silently no-op behind continue-on-error.
          node-version: '24'

      # Reject anything that is not a well-formed locale code before it reaches a
      # shell command / branch name (defense-in-depth against workflow injection).
      - name: Validate inputs
        env:
          LOCALE: ${{ inputs.locale }}
          CONCURRENCY: ${{ inputs.concurrency }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          if ! printf '%s' "$LOCALE" | grep -qE '^(ar|zh-CN|fr|de|es|hi|id|it|ja|ko|pt-BR|sv|vi)$'; then
            echo "Unsupported locale: '$LOCALE' (must be an i18n.json target)"; exit 1
          fi
          if ! printf '%s' "$CONCURRENCY" | grep -qE '^([1-9]|10)$'; then
            echo "Invalid concurrency (1-10): '$CONCURRENCY'"; exit 1
          fi
          if ! printf '%s' "$MAX_ATTEMPTS" | grep -qE '^[1-9]$'; then
            echo "Invalid max_attempts (1-9): '$MAX_ATTEMPTS'"; exit 1
          fi

      - name: Self-test repair script
        run: node scripts/validateAndRepairTranslations.ts --self-test

      - name: List broken pages for locale
        env:
          LOCALE: ${{ inputs.locale }}
        run: node scripts/fixTranslations.ts --locale "$LOCALE" --detect-only

      - name: Repair broken translations for locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOCALE: ${{ inputs.locale }}
          CONCURRENCY: ${{ inputs.concurrency }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          node scripts/fixTranslations.ts \
            --locale "$LOCALE" \
            --concurrency "$CONCURRENCY" \
            --max-attempts "$MAX_ATTEMPTS"

      - name: Validate translations (mintlify)
        continue-on-error: true
        run: |
          npm install -g mint
          mint validate

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected. Will create PR."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected. Skipping PR creation."
          fi

      - name: Configure Git
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Create branch and commit changes
        if: steps.check-changes.outputs.has_changes == 'true'
        id: create-branch
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          BRANCH_NAME="fix-translations-${LOCALE}-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "fix(i18n): repair untranslated ${LOCALE} pages

          Force-retranslated only the English-passthrough / missing pages for
          ${LOCALE} via lingo.dev, then ran MDX repair.
          Generated by the Fix Translations workflow."

      - name: Push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
        run: git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALE: ${{ inputs.locale }}
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
        run: |
          gh pr create \
            --title "fix(i18n): repair untranslated ${LOCALE} pages" \
            --body "This PR repairs pages that were left as **English passthrough** (or were missing) for locale \`${LOCALE}\`.

          ## What changed
          - Auto-detected pages whose translated body was still English (native-script ratio too low) or absent
          - Force-retranslated **only those** files for \`${LOCALE}\` via lingo.dev (other locales untouched)
          - Ran the standard MDX repair (restore locked JSX/frontmatter, fix code fences)

          ## How to review
          - Confirm the previously-English pages now render in \`${LOCALE}\`
          - Spot-check that JSX components, code blocks, and links are intact
          - The workflow log lists every file that was repaired and any that still failed

          ---
          *Automatically created by the [Fix Translations workflow](.github/workflows/fix-translations.yml)*" \
            --base main \
            --head "$BRANCH_NAME"
