# Vale configuration for the Dodo Payments docs.
#
# Mintlify runs Vale as a CI check on every pull request. Without a config in the
# repo it falls back to Mintlify's default configuration, which spellchecks every
# changed .mdx with an English dictionary -- including the 13 machine-translated
# locale folders. That produced ~221k suggestions per translation-sync PR, none of
# them actionable.
#
# This file mirrors Mintlify's default configuration and adds two things:
#   1. A project vocabulary at styles/config/vocabularies/Mintlify/accept.txt,
#      covering Dodo Payments product terms, API field names, and vendor names.
#      Note: a custom .vale.ini replaces Mintlify's built-in vocabulary, so
#      accept.txt carries their default word list as well.
#   2. Prose linting disabled for the translated locale folders (see below).
#
# Docs: https://www.mintlify.com/docs/deploy/ci#vale

# Relative to this file. Absolute paths and ".." are rejected by Mintlify.
StylesPath = styles
MinAlertLevel = suggestion

# Inline HTML tags to ignore (code/tt for code snippets, img/url for links/images, a for anchor tags)
IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure

# Vocabularies
Vocab = Mintlify

# Parse MDX as MD to avoid fragility with JSX
[formats]
mdx = md

# Only match MDX
[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO # Enforces really harsh capitalization rules, keep off

# Ignore JSX/MDX-specific syntax patterns
# `import ...`, `export ...`
# `<Component ... />`
# `<Component>...</Component>`
# `{ ... }`
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>), \
\{[^}]*\}

# Exclude multiline JSX and curly braces
# `<Component \n ... />`
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})

# Machine-translated locales. These folders are generated by lingo.dev from the
# English source and are never hand-edited (see AGENTS.md), so an English prose
# linter has nothing actionable to report on them -- only false positives, e.g.
# Vale.Repetition flagging correct German ("bevor Sie sie speichern") or Vale.Spelling
# flagging every non-English word. Fix prose in the English source instead; the
# next sync propagates it.
#
# The leading `**/` makes the glob match whether Vale is handed repo-relative or
# absolute paths. It still matches whole path segments only, so `developer-resources`
# (de) and `integrations` (it) keep being linted.
[**/{ar,cn,de,es,fr,hi,id,it,ja,ko,pt-BR,sv,vi}/**]
BasedOnStyles = ""
